<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://aohiojvhpgfdevwcnfxr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_GfAUv_zmNXoXUAtje2E37g_INuoQE2V';
let sb=null,cloudSyncTimer=null,cloudSyncBusy=false,cloudSyncAgain=false;
try{if(window.supabase?.createClient)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){console.warn('Supabase başlatılamadı',e)}
function openAccount(){if(window.booknestUser){modal(`<div class="modal-head"><h2>BookNest hesabı</h2><button class="close" onclick="closeModal()">✕</button></div><p>${esc(window.booknestUser.email||'')}</p><p class="muted">Bu cihazdaki kitaplığın hesabınla eşitlenir.</p><div class="actions"><button class="secondary" onclick="syncNow()">Şimdi eşitle</button><button class="danger" onclick="signOutBookNest()">Çıkış yap</button></div>`)}else modal(`<div class="modal-head"><h2>Bulut eşitleme</h2><button class="close" onclick="closeModal()">✕</button></div><p class="muted">BookNest'i giriş yapmadan kullanabilirsin. E-posta bağlantısıyla giriş yaptığında kitaplığın cihazların arasında eşitlenir.</p><div class="field"><label>E-posta adresin</label><input id="bn-email" type="email" placeholder="ornek@eposta.com" autocomplete="email"></div><button style="margin-top:12px;width:100%" onclick="sendMagicLink()">Giriş bağlantısı gönder</button><p id="bn-auth-msg" class="muted" style="font-size:12px;margin-top:10px">Şifresiz, tek kullanımlık bağlantı.</p>`)}
async function sendMagicLink(){let email=document.getElementById('bn-email')?.value.trim();if(!email||!email.includes('@'))return toast('Geçerli bir e-posta adresi yaz.');if(!sb)return toast('Bulut bağlantısı yüklenemedi. Sayfayı yenileyip tekrar dene.');let msg=document.getElementById('bn-auth-msg');if(msg)msg.textContent='Bağlantı gönderiliyor…';let {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});if(error){if(msg)msg.textContent='Gönderilemedi: '+error.message;return}if(msg)msg.textContent='Giriş bağlantısı e-posta adresine gönderildi. Gelen kutunu ve spam klasörünü kontrol et.';}
function updateAccountUi(){let status=document.getElementById('account-status'),btn=document.querySelector('#account-panel button');if(!status||!btn)return;if(window.booknestUser){status.textContent='Bağlı: '+(window.booknestUser.email||'hesap');btn.textContent='Hesap / eşitleme'}else{status.textContent='Misafir modu · Bu cihazda kayıt';btn.textContent='E-posta ile eşitle'}}
function mergeCloudPayload(local,remote){let out={...remote,...local};for(let k of ['books','sessions','shelves','quotes']){let m=new Map();for(let x of (remote?.[k]||[]))if(x?.id)m.set(x.id,x);for(let x of (local?.[k]||[]))if(x?.id)m.set(x.id,x);out[k]=[...m.values()]}out.goals={...(remote?.goals||{}),...(local?.goals||{})};return out}
async function loadBookNestCloud(user){if(!sb||!user)return;try{let {data,error}=await sb.from('user_data').select('payload').eq('user_id',user.id).maybeSingle();if(error)throw error;if(data?.payload){db=mergeCloudPayload(db,data.payload);db.books||=[];db.sessions||=[];db.shelves||=[];db.goals||={month:2,year:24};safeStorage.set(KEY,JSON.stringify(db));await writeBookNestCloud(user)}else await writeBookNestCloud(user);render();toast('Kitaplığın bulut hesabınla eşitlendi.')}catch(e){console.error(e);toast('Bulut eşitleme hatası: '+(e.message||'Bağlantı kurulamadı'))}}
async function writeBookNestCloud(user){if(!sb||!user)return;let {error}=await sb.from('user_data').upsert({user_id:user.id,payload:db,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error}
function queueCloudSync(){if(!window.booknestUser||!sb)return;clearTimeout(cloudSyncTimer);cloudSyncTimer=setTimeout(syncNow,1100)}
async function syncNow(){if(!window.booknestUser||!sb)return;if(cloudSyncBusy){cloudSyncAgain=true;return}cloudSyncBusy=true;try{await writeBookNestCloud(window.booknestUser);toast('Bulut yedeği güncellendi.')}catch(e){console.error(e);toast('Buluta kaydedilemedi: '+(e.message||'Bağlantıyı kontrol et'))}finally{cloudSyncBusy=false;if(cloudSyncAgain){cloudSyncAgain=false;queueCloudSync()}}}
async function signOutBookNest(){if(!sb)return;let {error}=await sb.auth.signOut();if(error)return toast('Çıkış yapılamadı: '+error.message);window.booknestUser=null;updateAccountUi();closeModal();toast('Çıkış yapıldı. Bu cihazdaki kitapların korunuyor.')}
async function initBookNestAuth(){if(!sb){updateAccountUi();return}let {data}=await sb.auth.getSession();if(data.session?.user){window.booknestUser=data.session.user;updateAccountUi();await loadBookNestCloud(window.booknestUser)}else updateAccountUi();sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session?.user){window.booknestUser=session.user;updateAccountUi();setTimeout(()=>loadBookNestCloud(session.user),0)}else if(event==='SIGNED_OUT'){window.booknestUser=null;updateAccountUi()}})}

<script>
const KEY='kitaplik_v1';const safeStorage={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};const makeId=()=>{try{return crypto.randomUUID()}catch(e){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}};let db;try{db=JSON.parse(safeStorage.get(KEY)||'null')}catch(e){db=null}db=db||{books:[],shelves:[{id:'home',name:'Ev · Salon',location:'Ev',type:'kitaplık'}],sessions:[],quotes:[],goals:{month:2,year:24}};db.books ||= [];db.sessions ||= [];db.shelves ||= [{id:'home',name:'Ev · Salon',location:'Ev',type:'kitaplık'}];db.goals ||= {month:2,year:24};db.books.forEach(b=>{b.rounds ||= [];if(!b.rounds.length)b.rounds.push({id:'round-1',number:1,startDate:b.startedAt||null,finishDate:b.finishedAt||null,totalPages:0,totalMinutes:0,status:b.status==='read'?'completed':b.status==='reading'?'active':'planned'});b.currentRoundId ||= b.rounds.find(r=>r.status==='active')?.id || b.rounds[0]?.id;});db.sessions.forEach(s=>{let b=db.books.find(b=>b.id===s.bookId);if(b){s.roundId ||= b.currentRoundId;s.roundNumber ||= b.rounds.find(r=>r.id===s.roundId)?.number||1;}});db.books.forEach(b=>b.rounds.forEach(r=>{let roundSessions=db.sessions.filter(s=>s.bookId===b.id&&(s.roundId===r.id||(!s.roundId&&s.roundNumber===r.number)));r.totalPages=roundSessions.reduce((sum,s)=>sum+(s.pages||0),0);r.totalMinutes=roundSessions.reduce((sum,s)=>sum+(s.minutes||0),0);}));let view='home',filter='all',selected=null,timer=null,elapsed=0,sessionBook=null;const save=()=>{if(!safeStorage.set(KEY,JSON.stringify(db)))toast('Veriler bu oturumda saklanamayabilir.');if(window.booknestUser)queueCloudSync();};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const statuses={reading:'Şu an okuyorum',toRead:'Okuyacaklarım',read:'Okuduklarım',abandoned:'Yarım bıraktım'};const main=document.getElementById('main');function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2600)}function cover(b,size=''){return `<div class="cover ${size}">${b.cover?`<img src="${esc(b.cover)}" alt="${esc(b.title)} kapağı">`:esc(b.title||'Kitap')}</div>`}function statusBadge(b){return `<span class="badge">${statuses[b.status]||'Kitaplığım'}</span>`}function bookCard(b){return `<div class="card book-card" onclick="detail('${b.id}')">${cover(b)}<h3>${esc(b.title)}</h3><p>${esc(b.author||'Yazar bilgisi yok')}</p>${statusBadge(b)}</div>`}function pageHeader(title,sub,actions=''){return `<div class="topbar"><div><h1>${title}</h1><p>${sub||''}</p></div><div class="actions">${actions}</div></div>`}function startReading(b){sessionBook=b;openSessionModal(b)}function openSessionModal(b){modal(`<div class="modal-head"><h2>Okuma zamanı</h2><button class="close" onclick="closeModal()">✕</button></div><div class="row">${cover(b,'sm')}<div><b>${esc(b.title)}</b><p class="muted">${esc(b.author||'')}</p></div></div><div class="form-grid" style="margin-top:15px"><div class="field"><label>Başlangıç sayfası</label><input id="startpage" type="number" min="1" value="${b.lastPage||1}"></div><div class="field"><label>Süre seç (dakika)</label><select id="duration"><option value="0">Serbest süre</option><option>10</option><option>15</option><option selected>25</option><option>30</option><option>45</option><option>60</option></select></div></div><p class="muted">Başlatınca sayaç açılır. Süre dolduğunda veya bitir dediğinde son sayfanı kaydedeceğiz.</p><button onclick="beginSession('${b.id}')">▶ Okumaya başla</button>`)}function beginSession(id){let b=db.books.find(x=>x.id===id);elapsed=0;let start=parseInt(document.getElementById('startpage').value||1);let mins=parseInt(document.getElementById('duration').value||0);let round=b.rounds?.find(r=>r.id===b.currentRoundId);if(!round||round.status==='completed'){let number=(b.rounds?.length||0)+1;round={id:makeId(),number,startDate:new Date().toISOString(),finishDate:null,totalPages:0,totalMinutes:0,status:'active'};b.rounds ||= [];b.rounds.push(round);b.currentRoundId=round.id;}else if(round.status!=='active'){round.status='active';round.startDate ||= new Date().toISOString();}sessionBook={id,start,minutes:mins,started:Date.now(),roundId:round.id,roundNumber:round.number};closeModal();modal(`<div class="modal-head"><h2>Okuma modu</h2><button class="close" onclick="endSession(false)">Bitir ✕</button></div><div class="row">${cover(b,'sm')}<div><b>${esc(b.title)}</b><p class="muted">Sessizce oku, süre senin için kaydediliyor.</p></div></div><div style="text-align:center;padding:20px"><div class="timer" id="timer">00:00</div><p>Başlangıç sayfası: <b>${start}</b></p></div><button class="secondary" onclick="endSession(false)">Okuma oturumunu bitir</button>`);timer=setInterval(()=>{elapsed=Math.floor((Date.now()-sessionBook.started)/1000);let mm=Math.floor(elapsed/60),ss=elapsed%60;let t=document.getElementById('timer');if(t)t.textContent=String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');if(mins>0&&elapsed>=mins*60)endSession(false)},1000)}function endSession(finished){if(timer){clearInterval(timer);timer=null}if(!sessionBook)return;let b=db.books.find(x=>x.id===sessionBook.id);let minutes=Math.max(1,Math.round(elapsed/60));modal(`<div class="modal-head"><h2>Okuma oturumu</h2><button class="close" onclick="closeModal()">✕</button></div><p>Başlangıç sayfan: <b>${sessionBook.start}</b> · Süre: <b>${minutes} dk</b></p><div class="field"><label>Şimdi kaçıncı sayfadasın?</label><input id="endpage" type="number" min="${sessionBook.start}" value="${sessionBook.start}"></div><div style="margin:12px 0"><button class="secondary" onclick="confirmEnd('${b.id}',false)">Kaydet</button> <button class="danger" onclick="confirmEnd('${b.id}',true)">📕 Kitabı bitirdim</button></div>`,false)}function confirmEnd(id,finish){let b=db.books.find(x=>x.id===id),end=parseInt(document.getElementById('endpage').value||sessionBook.start),pages=Math.max(0,end-sessionBook.start);if(!Number.isFinite(end)||end<sessionBook.start){toast('Bitiş sayfası başlangıç sayfasından küçük olamaz.');return}let s={id:makeId(),bookId:id,roundId:sessionBook.roundId,roundNumber:sessionBook.roundNumber,date:new Date().toISOString(),minutes:Math.max(1,Math.round(elapsed/60)),startPage:sessionBook.start,endPage:end,pages};db.sessions.push(s);b.lastPage=end;b.totalPagesRead=(b.totalPagesRead||0)+pages;b.totalMinutes=(b.totalMinutes||0)+s.minutes;let round=b.rounds?.find(r=>r.id===sessionBook.roundId);if(round){round.totalPages=(round.totalPages||0)+pages;round.totalMinutes=(round.totalMinutes||0)+s.minutes;round.status='active';}if(b.status!=='read'&&b.status!=='abandoned')b.status='reading';if(finish){if(!confirm('Kitabı bitirdiğini onaylıyor musun?'))return;b.status='read';b.finishedAt=new Date().toISOString();b.lastPage=b.pages||end;let completedRound=b.rounds?.find(r=>r.id===sessionBook.roundId);if(completedRound){completedRound.status='completed';completedRound.finishDate=b.finishedAt;}b.currentRoundId=sessionBook.roundId;}save();sessionBook=null;closeModal();if(finish){if(confirm('Kitabı bitirdiğin için tebrikler! Paylaşım kartı hazırlamak ister misin?'))shareBook(b)}else if(confirm('Okuma oturumu kaydedildi. Paylaşım kartı oluşturmak ister misin?'))shareSession(s,b);render();toast('Okuma kaydedildi')}
function statsPage(){
 const now=new Date(),month=now.getMonth(),year=now.getFullYear();
 const monthSessions=db.sessions.filter(s=>{let d=new Date(s.date);return d.getMonth()===month&&d.getFullYear()===year});
 const yearSessions=db.sessions.filter(s=>new Date(s.date).getFullYear()===year);
 const sumPages=a=>a.reduce((n,s)=>n+(Number(s.pages)||0),0),sumMinutes=a=>a.reduce((n,s)=>n+(Number(s.minutes)||0),0);
 const monthPages=sumPages(monthSessions),monthMinutes=sumMinutes(monthSessions),yearPages=sumPages(yearSessions),yearMinutes=sumMinutes(yearSessions);
 const booksFinishedThisMonth=db.books.filter(b=>b.status==='read'&&b.finishedAt&&new Date(b.finishedAt).getMonth()===month&&new Date(b.finishedAt).getFullYear()===year).length;
 const booksFinishedThisYear=db.books.filter(b=>b.status==='read'&&b.finishedAt&&new Date(b.finishedAt).getFullYear()===year).length;
 const avgRate=db.sessions.length?db.sessions.reduce((a,s)=>a+(Number(s.pages)||0)/Math.max(1,Number(s.minutes)||1),0)/db.sessions.length:0;
 const rate=monthMinutes?monthPages/monthMinutes:0;
 const mood=avgRate===0?'İlk oturumlarınla kişisel okuma hızını oluşturmaya başlayacağız.':rate<avgRate*.85?'Bu ay tempon ortalamanın altında. Birkaç dakikalık okuma bile ritmini yeniden kurabilir.':rate>avgRate*1.15?'Bu ay ortalamanı geçtin! Harika bir okuma ritmi yakalamışsın.':'Bu ay kendi ortalama ritminde ilerliyorsun. İstikrar çok değerli.';
 const monthTarget=Math.max(1,Number(db.goals.month)||2),yearTarget=Math.max(1,Number(db.goals.year)||24);
 const monthPct=Math.min(100,Math.round(booksFinishedThisMonth/monthTarget*100)),yearPct=Math.min(100,Math.round(booksFinishedThisYear/yearTarget*100));
 let dayMap={};monthSessions.forEach(s=>{let d=new Date(s.date).getDate();dayMap[d]=(dayMap[d]||0)+(Number(s.minutes)||0)});
 let maxDay=Math.max(1,...Object.values(dayMap));
 let genreMap={};db.sessions.forEach(s=>{let b=db.books.find(x=>x.id===s.bookId);if(b&&b.genre)genreMap[b.genre]=(genreMap[b.genre]||0)+(Number(s.pages)||0)});
 let genres=Object.entries(genreMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
 main.innerHTML=pageHeader('Okuma istatistikleri','Okuma ritmini, hedeflerini ve ilerlemeni takip et.',`<button class="secondary" onclick="editGoals()">⚙ Hedefleri düzenle</button><button onclick="quickStart()">▶ Okumaya başla</button>`)+
 `<div class="habit-grid"><div class="card habit-stat"><small>Bu ay okunan sayfa</small><strong>${monthPages}</strong><span class="muted">${monthMinutes} dakika</span></div><div class="card habit-stat"><small>Bu yıl okunan sayfa</small><strong>${yearPages}</strong><span class="muted">${yearMinutes} dakika</span></div><div class="card habit-stat"><small>Bu ay tamamlanan</small><strong>${booksFinishedThisMonth}</strong><span class="muted">kitap</span></div><div class="card habit-stat"><small>Ortalama okuma hızı</small><strong>${avgRate.toFixed(1)}</strong><span class="muted">sayfa / dakika</span></div></div>
 <div class="hero" style="margin-top:18px"><div class="card"><div class="section-head"><h2>📅 Aylık kitap hedefi</h2><b>${booksFinishedThisMonth} / ${monthTarget}</b></div><div class="progress-track"><span style="width:${monthPct}%"></span></div><p class="muted">${monthPct}% tamamlandı · ${Math.max(0,monthTarget-booksFinishedThisMonth)} kitap kaldı</p><div class="section-head"><h2>🎯 Yıllık kitap hedefi</h2><b>${booksFinishedThisYear} / ${yearTarget}</b></div><div class="progress-track"><span style="width:${yearPct}%"></span></div><p class="muted">${yearPct}% tamamlandı · ${Math.max(0,yearTarget-booksFinishedThisYear)} kitap kaldı</p></div><div class="card" style="background:${rate===0?'#f3f1eb':rate<avgRate*.85?'#f7e8d8':rate>avgRate*1.15?'#e4f0e5':'#eaf0e9'}"><h2>🌿 Okuma ritmin</h2><p>${mood}</p><p><b>${rate.toFixed(2)}</b> sayfa/dk bu ay · <b>${avgRate.toFixed(2)}</b> sayfa/dk genel ortalama</p></div></div>
 <div class="card"><div class="section-head"><h2>📊 Bu ay gün gün okuma</h2><small>dakika</small></div><div class="mini-bars">${Array.from({length:new Date(year,month+1,0).getDate()},(_,i)=>{let day=i+1,val=dayMap[day]||0;return `<div class="mini-bar" title="${day}. gün: ${val} dk" style="height:${Math.max(3,val/maxDay*100)}%"><small>${day}</small></div>`}).join('')}</div></div>
 <div class="hero" style="margin-top:18px"><div class="card"><h2>📚 Türlere göre okuma</h2>${genres.length?genres.map(([g,p])=>`<div style="margin:12px 0"><div class="row" style="justify-content:space-between"><span>${esc(g)}</span><b>${p} sayfa</b></div><div class="progress-track"><span style="width:${Math.min(100,p/Math.max(...genres.map(x=>x[1]))*100)}%"></span></div></div>`).join(''):'Henüz tür bilgisiyle kayıtlı okuma yok.'}</div><div class="card"><h2>🕰 Son oturumlar</h2>${db.sessions.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,7).map(s=>{let b=db.books.find(x=>x.id===s.bookId);return `<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><div><b>${esc(b?.title||'Silinmiş kitap')}</b><small class="muted" style="display:block">${new Date(s.date).toLocaleDateString('tr-TR')}</small></div><span>${s.pages||0} sf · ${s.minutes||0} dk</span></div>`}).join('')||'<p class="muted">Henüz okuma oturumu kaydı yok.</p>'}</div></div>`;
}
function editGoals(){modal(`<div class="modal-head"><h2>Okuma hedefleri</h2><button class="close" onclick="closeModal()">✕</button></div><div class="form-grid"><div class="field"><label>Aylık kitap hedefi</label><input id="goalmonth" type="number" min="1" value="${db.goals.month||2}"></div><div class="field"><label>Yıllık kitap hedefi</label><input id="goalyear" type="number" min="1" value="${db.goals.year||24}"></div></div><p class="muted">Hedefler tamamlanan kitap sayısına göre hesaplanır.</p><button onclick="saveGoals()">Hedefleri kaydet</button>`)}

function render(){try{document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===view));if(view==='home')home();else if(view==='library')library();else if(view==='reading')readingPage();else if(view==='shelves')shelvesPage();else if(view==='stats')statsPage();else throw new Error('Bilinmeyen ekran: '+view)}catch(e){console.error('BookNest render hatası:',e);main.innerHTML='<section class="card" style="padding:24px;margin:24px 0"><h2>BookNest ekranı oluşturulamadı</h2><p>Hata: <b>'+esc(e&&e.message||e)+'</b></p><details><summary>Teknik ayrıntı</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(e&&e.stack||'')+'</pre></details><p>Kitap verilerine dokunulmadı. Bu mesaj sorunun kaynağını belirlememizi sağlayacak.</p></section>'}}
function home(){let active=db.books.find(b=>b.status==='reading'),last=db.sessions.slice().sort((a,b)=>new Date(b.date)-new Date(a.date))[0],recent=last&&db.books.find(b=>b.id===last.bookId);let rec=active||suggestBook();let days=active&&active.startedAt?Math.max(1,Math.floor((Date.now()-new Date(active.startedAt))/86400000)):0;let monthSessions=db.sessions.filter(s=>new Date(s.date).getMonth()===new Date().getMonth()&&new Date(s.date).getFullYear()===new Date().getFullYear());let monthPages=monthSessions.reduce((a,s)=>a+s.pages,0),monthMins=monthSessions.reduce((a,s)=>a+s.minutes,0);let yearSessions=db.sessions.filter(s=>new Date(s.date).getFullYear()===new Date().getFullYear());let totalPages=yearSessions.reduce((a,s)=>a+s.pages,0),totalMins=yearSessions.reduce((a,s)=>a+s.minutes,0);let avg=db.sessions.length?db.sessions.reduce((a,s)=>a+s.pages/Math.max(1,s.minutes),0)/db.sessions.length:0;let recentRate=monthMins?monthPages/monthMins:0;let motivation=avg===0?'İlk okuma oturumunu başlat; ritmini birlikte keşfedelim.':recentRate<avg*.85?'🌱 Yavaşlamak da okumaktır. Küçük bir adım bugün yeter.':recentRate>avg*1.15?'🚀 Son zamanlarda ortalamanın üzerindesin, harika bir ritim yakaladın!':'🌿 Her zamanki ritmindesin. Düzenli okumaya devam!';main.innerHTML=pageHeader('Merhaba, kitap dostu 👋','Kütüphanen ve okuma yolculuğun tek yerde.',`<button class="secondary" onclick="addBook()">＋ Kitap ekle</button><button onclick="quickStart()">▶ Hızlı başlat</button>`)+`<div class="hero"><div class="card reading-card"><h2>${active?'Şu an okuduğun kitap':'Sana bir öneri'}</h2><p>${active?`Bu kitaba başlayalı ${days||'—'} gün oldu. Birkaç sayfa bile ilerleme!`: 'Kitaplığından seçilmiş bir sonraki keşif.'}</p><div class="reading-current">${rec?cover(rec):'<div class="cover">📚</div>'}<div><b>${rec?esc(rec.title):'Kitap ekleyerek başlayalım'}</b><p>${rec?esc(rec.author||''):'Kütüphanene ilk kitabını ekle.'}</p><p>${motivation}</p>${rec?`<button onclick="${active?`startReading(${JSON.stringify(rec).replace(/"/g,'&quot;')})`:`detail('${rec.id}')`}">${active?'Okumaya devam et':'Kitabı incele'}</button>`:''}</div></div></div><div class="card"><h2 style="margin-top:0">📈 Okuma özeti</h2><div class="stats" style="margin:0;grid-template-columns:1fr 1fr"><div><div class="num">${monthPages}</div><small>Bu ay · sayfa</small></div><div><div class="num">${monthMins}</div><small>Bu ay · dakika</small></div></div><p>${motivation}</p><div class="muted">Bu yıl: ${totalPages} sayfa · ${totalMins} dk</div></div></div><div class="stats"><div class="card stat"><div class="num">${db.books.length}</div><small>Kitaplıkta kitap</small></div><div class="card stat"><div class="num">${db.books.filter(b=>b.status==='read').length}</div><small>Okunan kitap</small></div><div class="card stat"><div class="num">${db.sessions.length}</div><small>Okuma oturumu</small></div></div><div class="section-head"><h2>Son eklenen kitaplar</h2><button class="ghost small" onclick="view='library';render()">Tüm kitaplar</button></div><div class="book-grid">${db.books.slice(-6).reverse().map(bookCard).join('')||'<div class="card empty">Henüz kitap eklenmedi. İlk kitabını ekleyebilirsin.</div>'}</div>`}
function suggestBook(){if(!db.books.length)return null;let read=db.books.filter(b=>b.status==='read'),genres=read.map(b=>b.genre).filter(Boolean);let freq={};genres.forEach(g=>freq[g]=(freq[g]||0)+1);let favorite=Object.keys(freq).sort((a,b)=>freq[b]-freq[a])[0];let candidates=db.books.filter(b=>b.status!=='reading');let least=candidates.filter(b=>!favorite||b.genre!==favorite);return least[0]||candidates[0]||db.books[0]}
function library(){let books=db.books.filter(b=>filter==='all'||b.status===filter);main.innerHTML=pageHeader('Kitaplarım',`${db.books.length} kitap · tüm kitaplığın`, `<button class="secondary" onclick="addBook()">＋ Kitap ekle</button>`)+`<div class="toolbar">${[['all','Tümü'],['reading','Şu an okuyorum'],['toRead','Okuyacaklarım'],['read','Okuduklarım'],['abandoned','Yarım bıraktım']].map(([v,l])=>`<button class="filter ${filter===v?'active':''}" onclick="filter='${v}';library()">${l}</button>`).join('')}</div><div class="book-grid">${books.map(bookCard).join('')||'<div class="card empty">Bu kategoride kitap yok.</div>'}</div>`}

function addBook(book={}){modal(`<div class="modal-head"><h2>Kitap ekle</h2><button class="close" onclick="closeModal()">✕</button></div><div class="row" style="margin-bottom:14px"><div id="coverPreview" class="cover sm">${esc(book.title||'Kapak')}</div><div><p class="muted">Kitap bilgilerini bulmak için arama kullanabilir, istersen elle doldurabilirsin.</p><div class="toolbar"><button class="secondary small" onclick="lookupBook()">ISBN / ad ile ara</button><button class="ghost small" onclick="scanBarcode()">▦ Barkod tara</button></div><input type="file" id="coverfile" accept="image/*" capture="environment" onchange="loadCover(event)" style="max-width:200px"></div></div><div id="book-search-results" class="full"></div><div class="form-grid"><div class="field"><label>Kitap adı *</label><input id="btitle" value="${esc(book.title||'')}"></div><div class="field"><label>Yazar</label><input id="bauthor" value="${esc(book.author||'')}"></div><div class="field"><label>Çevirmen</label><input id="btranslator" value="${esc(book.translator||'')}"></div><div class="field"><label>Tür</label><input id="bgenre" value="${esc(book.genre||'')}" placeholder="Fantastik, roman, tarih…"></div><div class="field"><label>Sayfa sayısı</label><input id="bpages" type="number" value="${book.pages||''}"></div><div class="field"><label>Yayın yılı</label><input id="byear" value="${book.year||''}"></div><div class="field"><label>ISBN</label><input id="bisbn" value="${esc(book.isbn||'')}"></div><div class="field"><label>Yayınevi</label><input id="bpublisher" value="${esc(book.publisher||'')}"></div><div class="field"><label>Durum</label><select id="bstatus">${Object.entries(statuses).map(([v,l])=>`<option value="${v}" ${book.status===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Kitaplık</label><select id="bshelf">${db.shelves.map(s=>`<option value="${s.id}" ${book.shelfId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Alınma tarihi</label><input id="badded" type="date" value="${book.addedAt||''}"></div><div class="field"><label>Okuma başlangıç tarihi</label><input id="bstarted" type="date" value="${book.startedAt||''}"></div><div class="field"><label>Bitirilme tarihi</label><select id="bfinishdate"><option value="">Tarih yok / hatırlamıyorum</option><option value="date">Tam tarih</option><option value="month">Ay ve yıl</option><option value="year">Sadece yıl</option></select><input id="bfinished" type="date" value="${book.finishedAt||''}"></div><div class="field"><label>İmzalı mı?</label><select id="bsigned"><option value="no">Hayır</option><option value="yes">Evet</option></select></div><div class="field"><label>Hediye mi?</label><select id="bgift" onchange="document.getElementById('giftwho').classList.toggle('hidden',this.value!=='yes')"><option value="no">Hayır</option><option value="yes">Evet</option></select><input id="giftwho" class="hidden" placeholder="Kim hediye etti?"></div><div class="field full"><label>Grup / etiket</label><input id="bgroup" value="${esc(book.group||'')}" placeholder="Örn. Stephen King, favoriler, kulüp"></div></div><button style="margin-top:16px" onclick="saveBook('${book.id||''}')">Kitabı kaydet</button>`)}
let pendingCover='';function loadCover(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{pendingCover=r.result;document.getElementById('coverPreview').innerHTML=`<img src="${pendingCover}">`};r.readAsDataURL(f)}async function lookupBook(){let query=prompt('ISBN, kitap adı veya yazar yaz:');if(!query)return;let clean=query.replace(/[-\s]/g,'');if(/^\d{10,13}$/.test(clean))return lookupBookByISBN(clean);return searchBookByText(query)}
function setBookField(id,value){let el=document.getElementById(id);if(el&&value!==undefined&&value!==null&&value!=='')el.value=String(value)}
function applyBookMetadata(meta,isbn){setBookField('btitle',meta.title);setBookField('bauthor',meta.author);setBookField('btranslator',meta.translator);setBookField('bpages',meta.pages);setBookField('byear',meta.year);setBookField('bisbn',isbn||meta.isbn);setBookField('bpublisher',meta.publisher);if(meta.cover){pendingCover=meta.cover;let preview=document.getElementById('coverPreview');if(preview)preview.innerHTML=`<img src="${esc(meta.cover)}" onerror="this.parentElement.textContent='Kapak bulunamadı'">`}}
async function lookupBookByISBN(raw){let isbn=String(raw||'').replace(/[-\s]/g,'');setBookField('bisbn',isbn);if(!/^\d{10,13}$/.test(isbn)){toast('Geçerli bir ISBN-10 veya ISBN-13 gir.');return}toast('Google Books ve Open Library katalogları taranıyor…');let googleTask=(async()=>{let u=`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent('isbn:'+isbn)}&maxResults=10`;let r=await fetch(u);if(!r.ok)throw Error('Google Books');let j=await r.json();return (j.items||[]).map(x=>{let v=x.volumeInfo||{},ids=v.industryIdentifiers||[];return {exact:ids.some(i=>i.identifier.replace(/[-\s]/g,'')===isbn),title:v.title,author:(v.authors||[]).join(', '),pages:v.pageCount,year:v.publishedDate,publisher:v.publisher,cover:v.imageLinks?.thumbnail?.replace('http:','https:')||v.imageLinks?.smallThumbnail?.replace('http:','https:'),isbn:ids.find(i=>i.identifier.replace(/[-\s]/g,'')===isbn)?.identifier}}).filter(x=>x.exact)})();let openTask=(async()=>{let r=await fetch(`https://openlibrary.org/isbn/${encodeURIComponent(isbn)}.json`);if(!r.ok)throw Error('Open Library');let d=await r.json();let author='';if(d.authors?.length){let a=await Promise.all(d.authors.slice(0,3).map(async x=>{try{let z=await fetch('https://openlibrary.org'+x.key+'.json');let q=await z.json();return q.name||''}catch{return ''}}));author=a.filter(Boolean).join(', ')}let cover=`https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false`;return {title:d.title,author,pages:d.number_of_pages,year:(d.publish_date||'').match(/\d{4}/)?.[0]||d.publish_date,publisher:d.publishers?.[0],cover,isbn}})();let [g,o]=await Promise.allSettled([googleTask,openTask]);let gm=g.status==='fulfilled'?g.value[0]:null,om=o.status==='fulfilled'?o.value:null;let merged={};if(gm)Object.assign(merged,gm);if(om)for(let [k,v] of Object.entries(om))if((merged[k]===undefined||merged[k]==='')&&v)merged[k]=v;if(!gm&&!om){toast('Bu ISBN iki katalogda da bulunamadı. ISBN kaydedildi; bilgileri elle tamamlayabilirsin.');return}applyBookMetadata(merged,isbn);toast(`Kitap bulundu${gm&&om?' · iki kaynak karşılaştırıldı':gm?' · Google Books':' · Open Library'}. Bilgileri kontrol edip kaydet.`)}
let bookSearchResults=[];
function chooseBookSearchResult(index){
 let item=bookSearchResults[index];if(!item)return;
 applyBookMetadata(item,item.isbn||'');
 let box=document.getElementById('book-search-results');
 if(box)box.innerHTML='<p class="muted">Seçilen sonuç forma aktarıldı. Bilgileri kontrol edip kaydedebilirsin.</p>';

}
async function searchBookByText(query){
 const box=document.getElementById('book-search-results');
 if(box)box.innerHTML='<p class="muted">Google Books ve Open Library aranıyor…</p>';
 try{
  let [g,o]=await Promise.allSettled([
   fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(query)+'&maxResults=10').then(r=>{if(!r.ok)throw Error('Google Books');return r.json()}),
   fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(query)+'&limit=10').then(r=>{if(!r.ok)throw Error('Open Library');return r.json()})
  ]);
  let google=g.status==='fulfilled'?(g.value.items||[]).map(x=>{let v=x.volumeInfo||{},ids=v.industryIdentifiers||[];return {title:v.title,author:(v.authors||[]).join(', '),pages:v.pageCount,year:v.publishedDate,publisher:v.publisher,cover:v.imageLinks?.thumbnail?.replace('http:','https:')||v.imageLinks?.smallThumbnail?.replace('http:','https:'),isbn:ids.find(i=>i.type==='ISBN_13')?.identifier||ids.find(i=>i.type==='ISBN_10')?.identifier,source:'Google Books'}}):[];
  let library=o.status==='fulfilled'?(o.value.docs||[]).map(x=>({title:x.title,author:(x.author_name||[]).join(', '),pages:x.number_of_pages_median,year:x.first_publish_year,publisher:x.publisher?.[0],cover:x.cover_i?'https://covers.openlibrary.org/b/id/'+x.cover_i+'-M.jpg':'',isbn:x.isbn?.find(v=>/^[0-9]{13}$/.test(v))||x.isbn?.[0],source:'Open Library'})):[];
  let seen=new Set();
  bookSearchResults=[...google,...library].filter(x=>x.title).filter(x=>{let k=(x.title+'|'+(x.author||'')).toLocaleLowerCase('tr');if(seen.has(k))return false;seen.add(k);return true;}).slice(0,12);
  if(!bookSearchResults.length){if(box)box.innerHTML='<p class="muted">Sonuç bulunamadı. Bilgileri elle girebilirsin.</p>';else toast('Sonuç bulunamadı; bilgileri elle girebilirsin.');return;}
  if(box)box.innerHTML='<div class="subsection"><b>Bulunan kitaplar</b><p class="muted">Doğru kitap ve baskıyı seç:</p>'+bookSearchResults.map((x,i)=>'<button type="button" class="secondary" style="display:flex;width:100%;gap:12px;align-items:center;text-align:left;margin:8px 0;color:var(--ink);white-space:normal" onclick="chooseBookSearchResult('+i+')">'+(x.cover?'<img src="'+esc(x.cover)+'" style="width:42px;height:60px;object-fit:cover;border-radius:5px" onerror="this.remove()">':'')+'<span><b>'+esc(x.title)+'</b><br><small>'+esc(x.author||'Yazar bilgisi yok')+' · '+esc(x.year||'Yıl yok')+' · '+esc(x.publisher||x.source)+'</small></span></button>').join('')+'</div>';
  else toast(bookSearchResults.length+' sonuç bulundu.');
 }catch(e){if(box)box.innerHTML='<p class="muted">Arama tamamlanamadı. Bağlantını kontrol et veya bilgileri elle gir.</p>';else toast('Arama tamamlanamadı.');}
}
async function scanBarcode(){if(!('BarcodeDetector'in window))return toast('Bu tarayıcı barkod taramayı desteklemiyor. ISBN arama seçeneğini kullan.');try{let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});modal(`<div class="modal-head"><h2>Barkod tara</h2><button class="close" onclick="closeModal()">✕</button></div><video id="scanvideo" autoplay playsinline style="width:100%;border-radius:14px"></video><p>Kitabın barkodunu kameraya göster.</p>`);let v=document.getElementById('scanvideo');v.srcObject=stream;let detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a']});let loop=async()=>{if(!v||v.paused)return;try{let codes=await detector.detect(v);if(codes.length){stream.getTracks().forEach(t=>t.stop());closeModal();toast('ISBN bulundu: '+codes[0].rawValue);addBook();setTimeout(()=>lookupBookByISBN(codes[0].rawValue),100);return}}catch{}requestAnimationFrame(loop)};v.onloadeddata=loop}catch(e){toast('Kamera erişimi başarısız')}}
function saveBook(id){let title=document.getElementById('btitle').value.trim();if(!title)return toast('Kitap adı gerekli');let b=id?db.books.find(x=>x.id===id):{id:makeId(),totalPagesRead:0,totalMinutes:0,rounds:[{id:'round-1',number:1,startDate:null,finishDate:null,totalPages:0,totalMinutes:0,status:'planned'}],currentRoundId:'round-1'};Object.assign(b,{title,author:document.getElementById('bauthor').value,translator:document.getElementById('btranslator').value,genre:document.getElementById('bgenre').value,pages:+document.getElementById('bpages').value||0,year:document.getElementById('byear').value,isbn:document.getElementById('bisbn').value,publisher:document.getElementById('bpublisher').value,status:document.getElementById('bstatus').value,shelfId:document.getElementById('bshelf').value,addedAt:document.getElementById('badded').value||new Date().toISOString().slice(0,10),startedAt:document.getElementById('bstarted').value,finishedAt:document.getElementById('bfinished').value,signed:document.getElementById('bsigned').value==='yes',gift:document.getElementById('bgift').value==='yes',giftFrom:document.getElementById('giftwho').value,group:document.getElementById('bgroup').value,cover:pendingCover||b.cover||''});if(!id)db.books.push(b);let activeRound=b.rounds?.find(r=>r.id===b.currentRoundId);if(activeRound&&b.startedAt&&!activeRound.startDate)activeRound.startDate=b.startedAt;pendingCover='';save();closeModal();render();toast('Kitap kaydedildi')}
function detail(id){let b=db.books.find(x=>x.id===id);selected=b;let sessions=db.sessions.filter(s=>s.bookId===id);modal(`<div class="modal-head"><h2>Kitap detayları</h2><button class="close" onclick="closeModal()">✕</button></div><div class="detail-layout">${cover(b)}<div class="detail-info"><h2>${esc(b.title)}</h2><p class="meta">${esc(b.author||'')} ${b.translator?'· Çeviri: '+esc(b.translator):''}</p>${statusBadge(b)}<p>${esc(b.genre||'Tür belirtilmemiş')} · ${b.pages||'—'} sayfa · ${b.year||'—'}</p><p>Kitaplığa eklenme: ${b.addedAt||'—'}<br>Başlama: ${b.startedAt||'—'}<br>Bitirme: ${b.finishedAt||'—'}</p><div class="actions"><button class="small" onclick="startReading('${b.id}')">▶ Okuma başlat</button><button class="secondary small" onclick="editBook('${b.id}')">Düzenle</button><button class="ghost small" onclick="toggleLend('${b.id}')">${b.lent?'Ödünçte':'Ödünç ver'}</button><button class="secondary small" onclick="newReadingRound('${b.id}')">↻ Yeni okuma turu</button></div></div></div><div class="subsection"><b>Okuma geçmişi</b><p>${sessions.length} oturum · ${sessions.reduce((a,s)=>a+s.pages,0)} sayfa · ${sessions.reduce((a,s)=>a+s.minutes,0)} dk</p>${sessions.slice().reverse().map(s=>`<p class="muted">${new Date(s.date).toLocaleDateString('tr-TR')} — ${s.startPage}-${s.endPage}. sayfa · ${s.pages} sayfa · ${s.minutes} dk</p>`).join('')}</div><div class="subsection"><b>Okuma turları</b>${(b.rounds||[]).map(r=>`<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span><b>${r.number}. tur</b> · ${r.status==='completed'?'Tamamlandı':r.status==='active'?'Devam ediyor':'Planlandı'}</span><span class="muted">${r.totalPages||0} sayfa · ${r.totalMinutes||0} dk</span></div>`).join('')}</div><div class="subsection"><b>Alıntılar & notlar</b><textarea id="booknote" placeholder="Bu kitaptan notlarını veya alıntılarını yaz…">${esc(b.notes||'')}</textarea><button class="secondary small" onclick="saveNote('${b.id}')">Notu kaydet</button></div><div class="subsection"><b>Kitabı tamamladım</b><button class="secondary small" onclick="finishFromDetail('${b.id}')">📕 Okudum olarak işaretle</button></div>`)}function newReadingRound(id){let b=db.books.find(x=>x.id===id);if(!b)return;let next=(b.rounds?.length||0)+1;if(!confirm(`${b.title} için ${next}. okuma turunu başlat? Önceki turlar korunacak.`))return;b.rounds ||= [];let r={id:makeId(),number:next,startDate:new Date().toISOString(),finishDate:null,totalPages:0,totalMinutes:0,status:'active'};b.rounds.push(r);b.currentRoundId=r.id;b.status='reading';b.startedAt=new Date().toISOString();b.lastPage=1;save();closeModal();startReading(b);toast(`${next}. okuma turu başladı`)}function editBook(id){let b=db.books.find(x=>x.id===id);closeModal();addBook(b)}function saveNote(id){db.books.find(b=>b.id===id).notes=document.getElementById('booknote').value;save();toast('Not kaydedildi')}function toggleLend(id){let b=db.books.find(x=>x.id===id);b.lent=!b.lent;save();closeModal();detail(id)}function finishFromDetail(id){if(!confirm('Bu kitabı okudum olarak işaretleyelim mi?'))return;let b=db.books.find(x=>x.id===id);b.status='read';b.finishedAt=new Date().toISOString().slice(0,10);let rr=b.rounds?.find(r=>r.id===b.currentRoundId);if(rr){rr.status='completed';rr.finishDate=b.finishedAt;}save();closeModal();if(confirm('Okuduğun kitabı paylaşmak ister misin?'))shareBook(b);render()}
function quickStart(){let b=db.books.find(x=>x.status==='reading')||db.books[0];if(!b)return addBook();startReading(b)}function shareSession(s,b){shareModal('Okuma paylaşımı',b,`Bu oturum · ${s.pages} sayfa · ${s.minutes} dk`,s)}function shareBook(b){shareModal('Kitap tamamlandı',b,'Kitabı tamamladım! 🎉',null)}function shareModal(title,b,caption,s){modal(`<div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">✕</button></div><div class="form-grid"><div class="field"><label>Boyut</label><select id="shareformat" onchange="changeShareFormat()"><option value="story">Dikey 9:16</option><option value="square">Kare 1:1</option></select></div><div class="field"><label>Tema</label><select id="sharetheme" onchange="changeShareTheme()"><option value="forest">Orman</option><option value="cream">Krem</option><option value="sunset">Gün batımı</option></select></div><div class="field full"><label>Paylaşımda göster</label><div><label><input type="checkbox" id="showtitle" checked onchange="changeShareContent()"> Kitap adı</label> <label><input type="checkbox" id="showcover" checked onchange="changeShareContent()"> Kapak</label> <label><input type="checkbox" id="showcaption" checked onchange="changeShareContent()"> Mesaj</label> <label><input type="checkbox" id="showstats" checked onchange="changeShareContent()"> Sayfa / süre bilgisi</label></div></div></div><div id="sharepreview" class="share-preview story" style="margin:14px 0"><div id="spcover">${cover(b,'sm')}</div><div><div class="share-title" id="sptitle">${esc(b.title)}</div><div class="share-meta" id="spcaption">${esc(caption)}</div><div class="share-meta" id="spstats">${s?`${s.pages} sayfa · ${s.minutes} dk`:b.totalPagesRead?`${b.totalPagesRead} sayfa · ${b.totalMinutes||0} dk toplam okuma`:''}</div></div><div style="opacity:.8;font-size:12px">KİTAPLIK · OKUMA GÜNLÜĞÜ</div></div><div class="actions"><button class="secondary" onclick="downloadShare()">⬇ Görseli kaydet</button><button onclick="closeModal()">Tamam</button></div><p class="footer-note">Önizleme taslağıdır; ekran görüntüsüyle paylaşabilir veya PNG olarak kaydedebilirsin.</p>`)}function changeShareFormat(){let el=document.getElementById('sharepreview');el.classList.toggle('square',document.getElementById('shareformat').value==='square');el.classList.toggle('story',document.getElementById('shareformat').value==='story')}function changeShareTheme(){let el=document.getElementById('sharepreview'),t=document.getElementById('sharetheme').value;el.style.background=t==='cream'?'linear-gradient(145deg,#eee5d3,#b6c0a5)':t==='sunset'?'linear-gradient(145deg,#ad6455,#e6b278)':'linear-gradient(145deg,#304c3e,#c4a779'}function changeShareContent(){['sptitle','spcaption','spstats','spcover'].forEach((id,i)=>{let checks=['showtitle','showcaption','showstats','showcover'];document.getElementById(id).classList.toggle('hidden',!document.getElementById(checks[i]).checked)})}function downloadShare(){let preview=document.getElementById('sharepreview');if(!preview)return;let story=document.getElementById('shareformat').value==='story',w=story?1080:1080,h=story?1920:1080,canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;let c=canvas.getContext('2d'),theme=document.getElementById('sharetheme').value;let gradients={forest:['#304c3e','#c4a779'],cream:['#eee5d3','#b6c0a5'],sunset:['#ad6455','#e6b278']};let g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,gradients[theme][0]);g.addColorStop(1,gradients[theme][1]);c.fillStyle=g;c.fillRect(0,0,w,h);c.fillStyle='#ffffff';c.textAlign='center';let y=story?180:100;let title=document.getElementById('sptitle'),caption=document.getElementById('spcaption'),stats=document.getElementById('spstats');if(!document.getElementById('showcover').checked){}else{let img=preview.querySelector('#spcover img');if(img&&img.complete){let cw=story?360:260,ch=story?540:390;c.drawImage(img,(w-cw)/2,y,cw,ch);y+=ch+(story?100:60)}else{c.font='bold 48px system-ui';c.fillText('📚',(w)/2,y);y+=80}}if(document.getElementById('showtitle').checked){c.font=`bold ${story?64:48}px system-ui`;wrapCanvasText(c,title.textContent,w-120,y,story?84:62);y+=story?180:120}if(document.getElementById('showcaption').checked){c.font=`${story?40:32}px system-ui`;wrapCanvasText(c,caption.textContent,w-140,y,story?56:44);y+=story?150:90}if(document.getElementById('showstats').checked){c.font=`${story?36:30}px system-ui`;wrapCanvasText(c,stats.textContent,w-140,y,story?54:42)}c.font='24px system-ui';c.fillText('KİTAPLIK · OKUMA GÜNLÜĞÜ',w/2,h-(story?100:60));canvas.toBlob(blob=>{if(!blob)return toast('Görsel oluşturulamadı');let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kitaplik-paylasim.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('PNG paylaşım kartı indirildi')},'image/png')}function wrapCanvasText(ctx,text,maxWidth,startY,lineHeight){let words=String(text||'').split(' '),line='',y=startY;for(let word of words){let test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,ctx.canvas.width/2,y);line=word;y+=lineHeight}else line=test}if(line)ctx.fillText(line,ctx.canvas.width/2,y)}function modal(html){document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden';document.getElementById('modal-root').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){document.getElementById('modal-root').innerHTML='';document.documentElement.style.overflow='';document.body.style.overflow=''}
